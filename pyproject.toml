[project]
name = "macros"
version = "0.1.0"
description = "Per-application global hotkey macros in a system-tray app, plus helper scripts."
requires-python = ">=3.12"
authors = []

# Runtime dependencies of Macros.py. Pinned with hashes in requirements.lock
# (regenerate with `python tools/lock.py`); these ranges only bound the resolver.
dependencies = [
    "pystray>=0.19,<0.20",
    "keyboard>=0.13,<0.14",
    "pyautogui>=0.9.54,<0.10",
    "pywin32>=311",
    "psutil>=7,<8",
    "pillow>=11,<12",
]

[project.optional-dependencies]
# Only mcvote.vote() - the legacy full-auto Selenium flow - needs this. The
# hotkey app's vote_server() opens the user's real browser and does not.
legacy-vote = [
    "selenium>=4.32,<5",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "uv>=0.12,<0.13",       # tools/lock.py
    "selenium>=4.32,<5",    # so mypy and tests can see mcvote's legacy flow
]
