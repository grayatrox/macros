[project]
name = "macros"
version = "0.1.0"
description = "Per-application global hotkey macros in a system-tray app, plus helper scripts."
requires-python = ">=3.12"
authors = []

# Runtime dependencies of Macros.py. Pinned with hashes in requirements.lock
# (regenerate with `python tools/lock.py`); these ranges only bound the resolver.
dependencies = [
    "pystray>=0.19,<0.20",
    "keyboard>=0.13,<0.14",
    "pyautogui>=0.9.54,<0.10",
    "pywin32>=311",
    "psutil>=7,<8",
    "pillow>=11,<12",
]

[project.optional-dependencies]
# Only mcvote.vote() - the legacy full-auto Selenium flow - needs this. The
# hotkey app's vote_server() opens the user's real browser and does not.
legacy-vote = [
    "selenium>=4.32,<5",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "uv>=0.12,<0.13",       # tools/lock.py
    "selenium>=4.32,<5",    # so mypy and tests can see mcvote's legacy flow
    "types-psutil",
    "types-pyautogui",
    "types-pywin32",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The scripts live at the repo root, not in a package.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]

# ---------------------------------------------------------------------------
# Ruff - lint + format. Same rule selection as the owner's other Python projects.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.pyw"]  # launcher.pyw; ruff skips .pyw by default
# Recipe Calc/ is a separate OpenProject project with its own tooling decisions.
extend-exclude = ["Recipe Calc"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive-datetime misuse
    "PTH",       # use pathlib, never os.path
    "RET",       # return simplification
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PL",        # pylint subset
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic values are the point of a test
    "PLC0415", # local imports keep a test's dependencies next to the test
    "ARG001",  # fakes must match a real signature, unused args included
    "ARG002",  # ditto, for methods on fake classes
    "ARG005",  # ditto, for lambdas standing in for real callables
]

# ---------------------------------------------------------------------------
# Mypy - strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["Macros.py", "launcher.pyw", "mcvote.py", "tools", "tests"]
# tools/ and tests/ are namespace packages rooted at the repo, so the tests
# `from tools import tasks` and tools/tasks.py resolve to one module name.
explicit_package_bases = true
# types-pywin32 leaves some win32clipboard functions unannotated (e.g.
# CloseClipboard, SetClipboardData). The gap is in the third-party stubs, so
# exempt calls into that module only; our own code stays fully checked. The
# top-level win32clipboard stub re-exports from win32.win32clipboard.
untyped_calls_exclude = ["win32.win32clipboard"]

[[tool.mypy.overrides]]
# Neither ships type information and typeshed has no stubs for them.
module = ["pystray", "keyboard"]
ignore_missing_imports = true
