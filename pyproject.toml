[project]
name = "launcher"
version = "0.1.0"
description = "Python File Launcher: lists the apps in plugins/ and launches them."
requires-python = ">=3.12"

# Runtime dependencies of launcher.pyw only. Each app in plugins/ declares its
# own in plugins/<app>/pyproject.toml. tools/lock.py compiles this file and those
# together into the hash-pinned requirements.lock, so one resolve pins them all
# (docs/adr/0005-root-declares-only-the-launcher.md). These ranges only bound
# the resolver; regenerate the locks with `python tools/lock.py`.
dependencies = [
    # launcher.pyw's GUI. Essentials holds QtWidgets without the large Addons.
    "PySide6-Essentials>=6.11,<6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "uv>=0.12,<0.13",       # tools/lock.py
    "selenium>=4.32,<5",    # so mypy and tests can see mcvote's legacy flow
    "types-psutil",
    "types-pyautogui",
    "types-pywin32",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The launcher's pluginhost package lives under src/, Macros' package under
# plugins/macros/src/; tools/ is imported from the root; Recipe Calc's modules
# import each other by bare name from their own folder.
pythonpath = ["src", "plugins/macros/src", ".", "plugins/recipe_calc"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

# ---------------------------------------------------------------------------
# Ruff - lint + format. Same rule selection as the owner's other Python projects.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.pyw"]  # launcher.pyw; ruff skips .pyw by default
# first-party: pluginhost, the macros package, tools/, and Recipe Calc's modules
src = ["src", "plugins/macros/src", ".", "plugins/recipe_calc"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive-datetime misuse
    "PTH",       # use pathlib, never os.path
    "RET",       # return simplification
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PL",        # pylint subset
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic values are the point of a test
    "PLC0415", # local imports keep a test's dependencies next to the test
    "ARG001",  # fakes must match a real signature, unused args included
    "ARG002",  # ditto, for methods on fake classes
    "ARG005",  # ditto, for lambdas standing in for real callables
]

# ---------------------------------------------------------------------------
# Mypy - strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["plugins/macros", "plugins/recipe_calc", "launcher.pyw", "src", "tools", "tests"]
# Recipe Calc's modules import each other by bare name, as its script runs them
mypy_path = ["src", "plugins/macros/src", "plugins/recipe_calc"]
# pluginhost is rooted at src/ and macros at plugins/macros/src/ (mypy_path);
# Macros.py, tools/ and tests/ are namespace packages rooted at the repo, so
# each file has one module name.
explicit_package_bases = true
# types-pywin32 leaves some win32clipboard functions unannotated (e.g.
# CloseClipboard, SetClipboardData). The gap is in the third-party stubs, so
# exempt calls into that module only; our own code stays fully checked. The
# top-level win32clipboard stub re-exports from win32.win32clipboard.
untyped_calls_exclude = ["win32.win32clipboard"]

[[tool.mypy.overrides]]
# Neither ships type information and typeshed has no stubs for them.
module = ["pystray", "keyboard"]
ignore_missing_imports = true
