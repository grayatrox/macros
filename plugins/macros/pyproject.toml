# The Macros app: the macros package in src/ beside this file, and what it
# needs at runtime. This is the only place these requirements are declared;
# tools/lock.py compiles them into the hashed locks, and launcher.pyw reads
# them to install a missing one. The package uses the launcher's pluginhost
# (first-start install), which Macros.py puts on sys.path. See
# docs/adr/0005-root-declares-only-the-launcher.md and
# docs/adr/0006-plugins-are-self-contained.md.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "macros"
version = "0.1.0"
description = "Per-application global hotkey macros in a system-tray app."
requires-python = ">=3.12"
dependencies = [
    "pystray>=0.19,<0.20",
    "keyboard>=0.13,<0.14",
    "pyautogui>=0.9.54,<0.10",
    "pywin32>=311",
    "psutil>=7,<8",
    "pillow>=11,<12",
    # The log window. Essentials holds QtWidgets without the large Addons.
    "PySide6-Essentials>=6.11,<6.12",
]

[project.optional-dependencies]
# Only mcvote.vote(), the legacy full-auto Selenium flow, needs this.
legacy-vote = [
    "selenium>=4.32,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
