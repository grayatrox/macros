# What the Macros app needs at runtime. A dependency declaration for the
# launcher, not an installable package: the code lives in src/macros. This is
# the only place these requirements are declared; tools/lock.py compiles them
# into the hashed locks. See docs/adr/0003-per-plugin-pyproject.md and
# docs/adr/0005-root-declares-only-the-launcher.md.
[project]
name = "macros"
version = "0.1.0"
description = "Per-application global hotkey macros in a system-tray app."
requires-python = ">=3.12"
dependencies = [
    "pystray>=0.19,<0.20",
    "keyboard>=0.13,<0.14",
    "pyautogui>=0.9.54,<0.10",
    "pywin32>=311",
    "psutil>=7,<8",
    "pillow>=11,<12",
    # The log window. Essentials holds QtWidgets without the large Addons.
    "PySide6-Essentials>=6.11,<6.12",
]

[project.optional-dependencies]
# Only mcvote.vote(), the legacy full-auto Selenium flow, needs this.
legacy-vote = [
    "selenium>=4.32,<5",
]
