# What Recipe Calc needs at runtime. A dependency declaration for the launcher,
# not an installable package. This is the only place these requirements are
# declared; tools/lock.py compiles them into the hashed locks. See
# docs/adr/0003-per-plugin-pyproject.md and docs/adr/0005-root-declares-only-the-launcher.md.
[project]
name = "recipe-calc"
version = "0.1.0"
description = "Minecraft recipe calculator."
requires-python = ">=3.12"
dependencies = [
    # The window. Essentials holds QtWidgets without the large Addons.
    "PySide6-Essentials>=6.11,<6.12",
    # Renders item and block icons. The app falls back to flat textures
    # without it, but the rendered icons are the normal experience.
    "pillow>=11,<12",
]
